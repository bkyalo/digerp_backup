name: Build exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build backup_fetch.exe
        run: pyinstaller --onefile --name backup_fetch backup_fetch.py

      - uses: actions/upload-artifact@v4
        with:
          name: digerp-backup-fetch
          path: dist\backup_fetch.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\backup_fetch.exe
